name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" || pip install -e . pytest pytest-cov pip-audit

      - name: Security audit
        run: pip-audit --skip-editable -f json -o /tmp/pip-audit.json || true

      - name: Run tests with coverage
        env:
          DB_URL: postgresql://memory:memory@localhost:5432/memory_test
          MCP_HTTP: "1"
          MEMORY_BEARER: test-bearer-token
          EMBED_MODEL: stub
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/memory_core \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: /tmp/pip-audit.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ --output-format=github

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t memory-core-mcp:ci .
        continue-on-error: true
