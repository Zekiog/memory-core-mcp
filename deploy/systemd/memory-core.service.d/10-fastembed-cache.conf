# Fixes: ProtectHome=true masks ~/.cache/huggingface, so fastembed's
# default cache path is invisible to the service -> embedder.available()
# fails -> embed_mode degrades to keyword-only search (silent).
#
# /opt/memory-core is already in the unit's ReadWritePaths, so pointing
# the cache there makes it visible and writable under the sandbox.
[Service]
Environment=FASTEMBED_CACHE_DIR=/opt/memory-core/.fastembed
Environment=HF_HOME=/opt/memory-core/.hf
Environment=HF_HUB_OFFLINE=1
