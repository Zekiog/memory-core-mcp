[project]
name = "memory-core-mcp"
version = "0.1.0"
description = "Self-hosted MCP memory server backed by Oracle Autonomous DB 23ai native AI Vector Search. Local-first, no cloud memory API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.6.0",
  "oracledb>=2.5.0",
  "python-dotenv>=1.0.1",
  "fastembed>=0.3.0",
]

[project.scripts]
memory-core-mcp = "memory_core.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_core"]
